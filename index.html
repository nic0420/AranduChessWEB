<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/arandu-logo.png" />
    <link rel="apple-touch-icon" href="/arandu-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1c120c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Arandu Chess - La mejor aplicación interactiva para aprender y jugar ajedrez online y en móviles. Análisis Stockfish 16, multijugador en vivo y PWA Offline." />
    <link rel="manifest" href="/manifest.json" />
    <title>Arandu Chess - Aprende y Juega Ajedrez Online</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('PWA ServiceWorker registrado con exito:', reg.scope);
          }).catch((err) => {
            console.warn('PWA ServiceWorker no se pudo registrar:', err);
          });
        });
      }
    </script>
  </body>
</html>
